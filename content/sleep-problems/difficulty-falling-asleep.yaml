id: problem-difficulty-falling-asleep
slug: difficulty-falling-asleep
title: 入睡困难
category: difficulty-initiating

symptoms:
  - 躺下后超过 30 分钟仍然无法入睡
  - 越想睡越清醒，大脑反而活跃起来
  - 思绪停不下来，反复回想白天的事或明天的安排
  - 因为担心睡不着而更加紧绷

possibleFactors:
  - 入睡时间不固定，生物钟信号变弱
  - 睡前使用手机、电脑等发光屏幕
  - 下午或傍晚摄入咖啡因（咖啡、浓茶、部分奶茶与功能饮料）
  - 睡前仍在处理工作或高强度信息
  - 卧室光线偏亮、有噪音或温度不合适
  - 白天活动量不足、久坐
  - 把床同时用于工作、刷手机，睡眠与床的关联被削弱

sleepKnowledge: |
  入睡并不是「关掉开关」，而是大脑从清醒状态逐步过渡到睡眠状态的过程。
  这个过程受两套系统共同影响：一套是累积睡眠压力的系统——清醒时间越长、
  活动量越大，入睡的驱动力越强；另一套是生物钟系统——它决定了你在一天中的
  哪几个时段更容易入睡。

  当这两套系统的节律被打乱时，即使身体已经疲惫，大脑也可能迟迟无法进入睡眠状态。
  这也是为什么「越累越睡不着」并不矛盾：疲惫感与入睡能力并不是同一件事。

  此外，对睡眠本身的担心会形成额外的唤醒。当一个人开始反复评估「我今晚能不能睡着」
  时，这种评估本身就是一种认知活动，会把大脑维持在清醒水平。

improvementMethods:
  - 固定每天的起床时间，周末也尽量不推迟超过一小时
  - 睡前 1 小时停止使用手机等发光屏幕
  - 如果躺下约 20 分钟仍未入睡，可以起身到别的房间做些安静的事，有困意再回到床上
  - 中午之后避免咖啡因
  - 把床主要用于睡眠，不在床上长时间工作或刷手机
  - 白天保证一定强度的活动，并尽量在早晨接触自然光
  - 把第二天要做的事写在纸上，让大脑不必反复记忆

faq:
  - question: 躺下多久睡不着才算入睡困难？
    answer: 临床上通常把「躺下后超过 30 分钟仍无法入睡」作为参考标准之一。但单次出现并不说明问题，需要看它是否经常发生、是否影响到白天的状态。
  - question: 越想睡越睡不着怎么办？
    answer: 这通常是因为「努力入睡」本身会提高唤醒水平。可以试着放弃「必须马上睡着」的目标，把注意力放在呼吸或身体的放松感上；如果 20 分钟仍无困意，起身做点安静的事比继续躺着更有效。
  - question: 睡前玩手机真的会影响入睡吗？
    answer: 屏幕发出的光会抑制褪黑素的分泌，同时内容本身也可能让大脑保持兴奋。两者叠加会推迟入睡时间。建议在睡前 1 小时停止使用。
  - question: 午睡会影响晚上入睡吗？
    answer: 有可能。午睡过长或过晚都会削弱晚上的睡眠驱动力。如果需要午睡，建议控制在 30 分钟以内，并安排在下午 3 点前。
  - question: 什么情况下建议看医生？
    answer: 如果入睡困难每周出现三次以上、持续超过一个月，或者已经明显影响白天的工作、情绪和生活质量，建议到睡眠门诊、神经内科或精神心理科就诊。
  - question: 喝点酒能帮助入睡吗？
    answer: 酒精可能会让人更快入睡，但会破坏后半夜的睡眠结构，使睡眠变浅、更容易醒。长期依靠酒精助眠反而会加重睡眠问题。

