id: problem-poor-sleep-quality
slug: poor-sleep-quality
title: 睡眠质量下降
category: poor-sleep-quality

symptoms:
  - 睡够了时长，醒来仍然觉得没解乏
  - 感觉整晚都在做梦，早上起来像没睡过
  - 白天精力不足、注意力难以集中
  - 睡眠「量」看起来够，但「质」明显不如以前

possibleFactors:
  - 总睡眠时间被压缩，深睡眠最先被削减
  - 作息时间不固定，睡眠节律紊乱
  - 睡前饮酒，破坏后半夜的睡眠结构
  - 长期处于紧张或思虑状态，睡眠偏浅
  - 睡眠环境存在持续干扰（噪音、光线、温度）
  - 缺乏日间活动与自然光接触
  - 年龄增长带来的睡眠结构变化

sleepKnowledge: |
  「睡眠质量」是一个综合感受，它并不等于某一个数值。
  同样是睡 7 个小时，有人醒来神清气爽，有人却像没睡过——差别通常在于睡眠结构，
  而不只是时长。

  睡眠由一个个周期组成，每个周期里浅睡眠、深睡眠与快速眼动睡眠的比例并不固定：
  深睡眠集中在前半夜，快速眼动睡眠集中在后半夜。这意味着，
  如果入睡时间过晚或中途频繁被打断，失去的往往正是修复效果最集中的那部分。

  另外，主观的「睡得好不好」还受到醒来时机的影响。如果醒来时正处在深睡眠阶段，
  即使睡够了时长，也会有一段明显的迟钝期。因此评价睡眠质量，
  更适合看整体趋势，而不是某一晚的感受。

improvementMethods:
  - 固定每天的起床时间，让睡眠节律稳定下来
  - 保证足够的卧床时长，给深睡眠留出发生的时间
  - 睡前避免饮酒
  - 减少卧室内的噪音与光线干扰，保持偏凉爽的温度
  - 白天保持适度运动，并尽量在早晨接触自然光
  - 连续记录 1–2 周的睡眠日志，用趋势代替单晚感受
  - 如果长期觉得睡不解乏并影响白天状态，建议就医评估

faq:
  - question: 睡了 8 小时还是很累是怎么回事？
    answer: 常见的原因包括睡眠结构被破坏（比如睡前饮酒、夜间频繁醒来）、作息不规律，以及醒来时机正好落在深睡眠阶段。时长够不等于质量够，需要看整体睡眠是否连续、是否有足够的深睡眠。
  - question: 深度睡眠时间少怎么办？
    answer: 深睡眠主要集中在前半夜，因此规律作息、避免睡前饮酒、保证足够的卧床时长是最直接的改善方向。如果长期觉得深睡眠不足并影响白天状态，建议做专业评估。
  - question: 为什么每天都做梦？
    answer: 每个人每晚都会做梦，只是记不记得的区别。快速眼动睡眠在后半夜占比更高，因此在这个阶段醒来时更容易记得梦的内容。记得做梦本身并不代表睡眠质量差。
  - question: 睡眠质量不好怎么办？
    answer: 建议从三个方向入手：固定起床时间以稳定节律，减少睡前饮酒与环境干扰以保护睡眠结构，以及记录一到两周的睡眠日志来判断真实趋势。如果持续没有改善，建议就医。
  - question: 睡眠质量和睡眠时间哪个更重要？
    answer: 两者都重要，且相互影响。时长不足会直接压缩深睡眠与快速眼动睡眠，而质量差会让足够的时长也无法带来恢复感。实际改善时通常先保证时长，再优化连续性。
  - question: 怎么判断自己睡得好不好？
    answer: 比起单晚的感受，更值得看的是白天状态：白天是否清醒、情绪是否稳定、注意力是否够用。如果白天状态长期不佳，即使自认为睡够了，也值得记录下来进一步评估。

