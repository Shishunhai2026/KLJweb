id: problem-night-awakening
slug: night-awakening
title: 夜间易醒
category: night-awakening

symptoms:
  - 睡着以后一晚上要醒好几次
  - 睡一两个小时就醒一次
  - 半夜醒来后很难再次入睡
  - 睡得浅、睡睡醒醒，早上起来像没睡过

possibleFactors:
  - 睡前饮水过多或饮酒
  - 卧室温度过高或过低
  - 环境噪音、光线变化（包括窗帘缝隙与待机指示灯）
  - 睡前情绪紧张或睡前大量信息输入
  - 打鼾或呼吸不畅
  - 夜间血糖波动或晚饭时间不规律
  - 年龄增长带来的睡眠结构变化

sleepKnowledge: |
  人的睡眠是分周期的。一个睡眠周期大约 90 到 110 分钟，包含浅睡眠、深睡眠和
  快速眼动睡眠三个阶段，一夜通常经历 4 到 6 个周期。

  在每个周期之间，人本来就会短暂地接近清醒状态——这是正常的生理现象，
  并非「睡眠出了故障」。区别在于：睡眠顺利的人在这些短暂觉醒后很快就会再次入睡，
  第二天甚至不记得自己醒过；而睡眠受到影响的人，会在这些短暂觉醒点上彻底醒来。

  因此，夜间易醒通常不是「醒来」这个动作本身的问题，而是「醒来之后能否再睡回去」的问题。
  让身体在夜间更容易维持睡眠状态，比试图阻止醒来更现实。

improvementMethods:
  - 睡前 2 小时减少饮水量，避免夜间被尿意叫醒
  - 睡前避免饮酒
  - 把卧室温度调至偏凉爽、保持安静并尽量遮光
  - 半夜醒来后不要看时间和手机，避免把注意力引向「还剩多少时间能睡」
  - 如果醒来后 20 分钟仍无困意，可以起身做些安静的事，有困意再回床上
  - 保持固定的起床时间，白天适度活动
  - 如果伴侣反映有严重打鼾或呼吸停顿，建议就医评估

faq:
  - question: 半夜醒来正常吗？
    answer: 正常。睡眠周期之间的短暂觉醒是生理现象，几乎每个人每晚都会发生若干次，只是大多数时候不会被记住。只有当频繁醒来并影响到白天状态时，才需要当作问题来对待。
  - question: 半夜醒来后应该看手机吗？
    answer: 不建议。看时间会让人开始计算「还能睡多久」，看手机会让大脑重新进入活跃状态，两者都会让再次入睡变得更难。醒来后尽量保持环境黑暗和安静。
  - question: 为什么凌晨容易醒？
    answer: 凌晨时段深睡眠逐渐减少、快速眼动睡眠增多，人更容易接近清醒状态。此外体温与激素水平的周期性变化也集中在这个时段。这些是生理规律，属于正常现象。
  - question: 怎样减少夜间醒来？
    answer: 可以从睡前饮水量、是否饮酒、卧室温度与遮光、噪音来源、睡前情绪状态这几个方向逐一排查。同时保持固定起床时间，让整体睡眠节律更稳定。
  - question: 什么情况下需要就医？
    answer: 如果夜间频繁醒来并伴有严重打鼾、呼吸停顿、白天极度困倦，或者问题持续超过一个月且明显影响白天状态，建议到睡眠门诊做进一步评估。
  - question: 半夜醒来后应该起床还是继续躺着？
    answer: 如果醒来后 20 分钟仍然没有困意，起身到别的房间做些安静的事会比继续躺着更有效。继续躺在床上辗转反侧，容易让大脑把床与「睡不着」联系起来。

