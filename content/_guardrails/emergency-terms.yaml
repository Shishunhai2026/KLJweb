# ---------------------------------------------------------------------------
# 急症 / 危机升级词表
#
# ⚠️ 命中本表的请求【绝不经过大模型】。
#    这是刻意的架构选择：大模型可能把危机表述当成普通睡眠问题来安抚，
#    而这恰恰是最危险的失败模式。命中即返回下面写死的固定话术。
#
# 号码核实：12356 为国家卫健委与工信部设立的全国统一心理援助热线，
#          2025 年 5 月 1 日起全国 31 个省份均已开通，无区号限制、无通话费用。
# ---------------------------------------------------------------------------
version: 1
updatedAt: "2026-10-01"

triggers:
  - id: self-harm-risk
    label: "自伤 / 自杀风险"
    action: escalate_emergency
    terms:
      - "自杀"
      - "不想活"
      - "想死"
      - "活不下去"
      - "轻生"
      - "结束生命"
      - "了结自己"
      - "死了算了"
      - "没意思活着"
    response: |
      您说的这些让我很在意。请先照顾好自己此刻的安全，这比睡眠问题重要得多。

      **如果您现在有伤害自己的想法，请立即做以下任一件事：**

      - 拨打 **120** 或直接前往就近医院急诊
      - 拨打全国统一心理援助热线 **12356**（24 小时，免费，无区号限制）
      - 联系身边您信任的人，请对方陪在您身边

      我是睡眠健康知识助手，无法提供危机干预。等您处于安全状态、并已获得专业支持后，
      如果还想了解睡眠方面的知识，我随时在这里。

  - id: acute-cardiac
    label: "急性心血管症状"
    action: escalate_emergency
    terms:
      - "胸痛"
      - "胸口疼"
      - "胸闷得厉害"
      - "呼吸困难"
      - "喘不上气"
      - "心悸得厉害"
      - "心跳得厉害"
    response: |
      您描述的症状需要尽快由医生评估，不适合在线上讨论睡眠问题。

      请立即拨打 **120** 急救电话，或前往就近医院急诊科就诊。

      这些症状可能与心脏或呼吸系统有关，需要专业的即时检查。
      在医生排除风险之前，请不要依赖任何睡眠方面的建议来应对。

  - id: neuro-emergency
    label: "神经系统急症"
    action: escalate_emergency
    terms:
      - "晕倒"
      - "昏倒"
      - "昏迷"
      - "抽搐"
      - "抽风"
      - "说不出话"
      - "半边身体"
      - "半身麻木"
      - "口角歪斜"
    response: |
      您描述的情况属于需要立即处理的急症。

      请立即拨打 **120** 急救电话，不要等待、不要自行前往。

      若为突发的一侧肢体无力、口角歪斜、言语不清，可能是脑卒中，
      溶栓治疗有严格的时间窗，越早到院越好。

  - id: severe-mental
    label: "严重精神症状"
    action: escalate_emergency
    terms:
      - "幻觉"
      - "幻听"
      - "妄想"
      - "听见有人说话"
      - "听到有人说话"
      - "精神失常"
      - "控制不住自己"
    response: |
      您描述的情况需要精神科医生的专业评估，这不是睡眠知识能够处理的问题。

      请尽快前往**精神专科医院**或综合医院的**精神科 / 心理科**就诊。
      如果情况紧急或无法自行前往，请拨打 **120**，或请家人陪同前往。

      全国统一心理援助热线 **12356** 也可以提供初步的心理支持与转介建议。

# 命中以上任何一条时，回答末尾统一附加的安全提示
