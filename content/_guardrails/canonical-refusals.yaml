# ---------------------------------------------------------------------------
# 固定拒绝话术（需求文档 §20 「AI 必须遵守的规则」）
#
# 命中即返回下面写死的话术，不经过大模型。
# 原因：这些是风险最高的意图，措辞必须逐字可控，不能交给概率模型即兴发挥。
# ---------------------------------------------------------------------------
version: 1
updatedAt: "2026-10-01"

refusals:
  # -------------------------------------------------------------------------
  - id: medication-substitution
    label: "询问能否替代或停用处方药"
    priority: 100
    patterns:
      - '(能|可以|能否|能不能|可不可以).{0,8}(替代|代替|取代).{0,8}(安眠药|处方药|西药|药物|安定)'
      - '(停|停掉|停了|戒掉|戒了|不吃|不用吃|摆脱).{0,6}(安眠药|处方药|安定|药)'
      # 语序相反的写法：「吃了几年安眠药，能停掉吗」——药名在前、动词在后
      - '(安眠药|处方药|安定|药物|西药).{0,12}(能|可以|能不能|能否|该不该)?.{0,6}(停|停用|停掉|停了|戒掉|戒了|不吃)'
      - '(我|本人).{0,8}(在吃|正在吃|吃着|吃).{0,10}(安眠药|药).{0,12}(能不能|可以|换成|改吃|换)'
      - '(艾司唑仑|安定|舒乐安定|阿普唑仑|佐匹克隆|唑吡坦).{0,12}(能|可以|换|替代|停)'
    response: |
      不建议自行停用或替换处方药。

      如果您正在接受失眠治疗，请与医生讨论具体方案——是否调整用药、如何调整、
      调整期间需要注意什么，都需要医生结合您的具体情况来判断。

      突然停用某些助眠类药物可能引起反跳性失眠或其他不适，
      因此这类决定不适合在线上做出。

      和颐林睡眠大师的产品信息可以进一步为您介绍，
      但不能替代医生的诊疗建议。
    disclaimer: "本回答为固定的安全话术。任何用药调整都必须由开具处方的医生决定。"

  # -------------------------------------------------------------------------
  - id: diagnosis-request
    label: "请求诊断疾病"
    priority: 90
    patterns:
      - '(我|本人).{0,8}(是不是|是不是得了|是不是有|算不算).{0,10}(失眠症|抑郁症|焦虑症|病|睡眠障碍)'
      - '(帮我|给我).{0,4}(诊断|看看|判断).{0,8}(病|是不是|什么病)'
      - '(我|这是|这算).{0,6}(得了|是什么|属于什么).{0,6}(病|症|障碍)'
    response: |
      我没有办法为您做出诊断，这需要医生通过面诊和必要的检查来判断。

      我能做的是：帮您梳理目前的睡眠表现，说明哪些因素可能与睡眠有关，
      并提供改善睡眠习惯的参考方向。

      如果您希望得到明确判断，建议前往医院的**睡眠门诊**、
      **神经内科**或**精神心理科**就诊。

      要不要先做一次睡眠自测？它可以帮您把目前的睡眠情况整理成一份可参考的记录，
      就诊时也能提供给医生。
    disclaimer: "本回答为固定的安全话术。本平台不提供疾病诊断服务。"

  # -------------------------------------------------------------------------
  - id: disease-treatment
    label: "询问产品能否治病"
    priority: 90
    patterns:
      - '(能|可以|能否|能不能).{0,6}(治好|治疗|治愈|根治|改善).{0,10}(失眠|抑郁|焦虑|病|症)'
      - '(和颐林|睡眠大师|这个产品|你们的产品|本产品).{0,12}(能|可以|有没有).{0,8}(治|疗效|效果好不好)'
      - '(对|治).{0,4}(失眠|抑郁|焦虑).{0,6}(有没有|有没|是否).{0,6}(用|效果|效)'
    response: |
      和颐林睡眠大师是**植物复合粉特殊膳食**，不是药品，不能用于治疗疾病。

      按照法规要求，它也不能宣称任何保健功能。
      网站上展示的相关研究资料均标注了证据等级，
      其中来自企业的资料都标明了「企业提供资料，待独立核验」，
      这些都不能等同于已获医学证明的结论。

      如果您正在被失眠困扰，建议先由医生评估，再决定是否需要以及如何干预。
    disclaimer: "本回答为固定的安全话术。本产品为特殊膳食，不是药品，不能治疗疾病。"

  # -------------------------------------------------------------------------
  - id: testimonial-as-evidence
    label: "把用户反馈当作疗效证据"
    priority: 80
    patterns:
      - '(有人|用户|别人|他们|网上).{0,10}(说|反馈|评论).{0,12}(喝了|吃了|用了).{0,12}(好|有效|管用|改善|好了)'
      - '(是不是|真的).{0,6}(有效|管用|有用).{0,10}(用户|反馈|评价)'
      - '(用户反馈|买家秀|好评).{0,10}(是不是|能说明|代表).{0,10}(有效|管用|效果)'
    response: |
      用户反馈属于个人体验，**不能作为产品效果的医学证据**。

      不同人的睡眠情况、生活作息、身体状态都不一样，
      个别人的感受无法推广到其他人，也无法说明产品本身起到了什么作用。

      网站「用户反馈」页面的每一条内容都附有说明：
      用户体验存在个体差异，仅代表个人感受，不构成产品功效保证。

      如果您想了解产品本身的信息，可以查看配方、使用方法、
      检测资料等有明确来源的内容。
    disclaimer: "本回答为固定的安全话术。个人体验不构成疗效证据。"

  # -------------------------------------------------------------------------
  - id: special-population
    label: "特殊人群服用咨询"
    priority: 85
    patterns:
      - '(孕妇|怀孕|哺乳期|喂奶).{0,8}(能|可以|能不能|能不能吃|吃|喝)'
      - '(小孩|孩子|儿童|婴儿|宝宝|幼儿).{0,8}(能|可以|能不能|吃|喝)'
      - '(我|本人).{0,6}(怀孕|哺乳|在备孕)'
      - '(有|得了|患有).{0,10}(糖尿病|高血压|肝病|肾病|甲状腺|心脏病).{0,10}(能|可以|能不能).{0,6}(吃|喝|用)'
    response: |
      这类情况需要由医生根据您的具体情况判断，我不能给出建议。

      孕期、哺乳期、婴幼儿以及患有慢性疾病、正在服药的人群，
      身体情况和营养需求都比较特殊，是否适合食用某种食品，
      需要医生结合您的病史和用药情况来判断。

      您可以先把这个问题记录下来，在下次复诊时直接询问您的主治医生。
    disclaimer: "本回答为固定的安全话术。特殊人群请遵医嘱。"

  # -------------------------------------------------------------------------
  - id: overdose-usage
    label: "超量服用咨询"
    priority: 80
    patterns:
      - '(多吃|多喝|加量|加倍|超量).{0,8}(几袋|多少|有效|效果|好得快)'
      - '(一天|一次).{0,6}(吃|喝).{0,4}(好)?(几袋|多少袋|多少)'
      - '(吃|喝).{0,4}(多了|过量).{0,8}(怎么办|有没有事|要紧吗)'
    response: |
      请按产品标签标示的食用方法服用，不要自行加量。

      根据产品资料，建议是早晚各 1 袋、每日不超过 3 袋。
      **实际使用请以产品标签及最新官方说明为准。**

      如果您已经一次食用了明显超出建议的量，并出现了不适，
      请及时就医或咨询医生。
    disclaimer: "本回答为固定的安全话术。食用量请以产品标签标示为准。"

  # -------------------------------------------------------------------------
  - id: stop-other-treatment
    label: "建议停用其他治疗"
    priority: 85
    patterns:
      - '(不用|不需要).{0,6}(看医生|去医院|治疗|吃药)'
      - '(是不是|可以).{0,6}(不用|不需要).{0,6}(看医生|去医院)'
    response: |
      是否需要就医、是否需要用药，应当由医生来判断，我不能替您做这个决定。

      睡眠问题有时与其他健康状况相关，专业评估能帮助排除这些可能。
      我可以在您就医之外，提供睡眠习惯和睡眠知识方面的参考信息，
      但不会建议您放弃任何正在进行的治疗。
    disclaimer: "本回答为固定的安全话术。请勿因任何线上建议中断既有治疗。"
