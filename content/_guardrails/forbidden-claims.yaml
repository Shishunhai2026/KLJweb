# ---------------------------------------------------------------------------
# 违禁表述表
#
# 用途：扫描 AI 生成的回答、文章的 quickAnswer / coreConclusions，
#       以及任何未经来源登记的正文表述。
#
# 为什么是「数据」而不是「代码」：合规口径会随监管解释变化，
# 改这个文件不需要重新部署逻辑，也让每一条规则都能被单元测试按 id 断言。
#
# ⚠️ 本产品定位为「特殊膳食」。按中国现行法规，特殊膳食不得宣称保健功能，
#    因此「治疗」「疗效」这类保健食品都不该使用的措辞对本产品同样禁用。
# ---------------------------------------------------------------------------
version: 1
updatedAt: "2026-10-01"

# 一级：绝对禁用。出现在任何上下文都判定违规。
absoluteForbidden:
  - term: "治愈"
    reason: "暗示疾病可被治愈，属医疗效果宣称"
  - term: "根治"
    reason: "暗示疾病可被根除，属医疗效果宣称"
  - term: "断根"
    reason: "同「根治」"
  - term: "除根"
    reason: "同「根治」"
  - term: "药到病除"
    reason: "属医疗效果宣称"
  - term: "包治百病"
    reason: "属医疗效果宣称"
  - term: "彻底治好"
    reason: "属医疗效果宣称"
  - term: "永不复发"
    reason: "对疗效作出绝对化承诺"
  - term: "抗癌"
    reason: "抗癌属药品/保健食品功能声称范围，特殊膳食不得宣称"
  - term: "抗肿瘤"
    reason: "同「抗癌」"
  - term: "杀死癌细胞"
    reason: "同「抗癌」"
  - term: "抑制肿瘤"
    reason: "同「抗癌」"
  - term: "修复神经细胞"
    reason: "神经修复属医疗声称，超出特殊膳食可宣称范围"
  - term: "修复大脑"
    reason: "同「修复神经细胞」"
  - term: "修复受损神经"
    reason: "同「修复神经细胞」"

# 二级：在描述本产品 / 本品牌时禁止。
# （在纯粹的睡眠科普语境中，「治疗」等词可以正常出现，
#   例如「是否需要治疗应由医生评估」，因此不能做全局硬禁。）
contextualForbidden:
  - term: "治疗失眠"
    reason: "本产品不得声称治疗失眠"
  - term: "治疗睡眠"
    reason: "本产品不得声称治疗睡眠问题"
  - term: "疗效"
    reason: "「疗效」是药品用语，本产品不得使用"
  # 注：不设「主治」一词。中文里「主治医生 / 主治医师」是正当表述，
  #     全局禁用会造成误伤；与之等价的药品用语「适应症」已单独列出。
  - term: "适应症"
    reason: "「适应症」是药品用语，本产品不得使用"
  - term: "替代药物"
    reason: "不得声称产品可替代药物"
  - term: "代替药物"
    reason: "同「替代药物」"
  - term: "取代药物"
    reason: "同「替代药物」"
  - term: "替代安眠药"
    reason: "不得声称产品可替代安眠药"
  - term: "代替安眠药"
    reason: "同「替代安眠药」"
  - term: "可以停药"
    reason: "不得建议用户停用处方药"
  - term: "不用吃药"
    reason: "不得建议用户停用处方药"
  - term: "无副作用"
    reason: "绝对化安全性承诺"
  - term: "没有任何副作用"
    reason: "绝对化安全性承诺"
  - term: "零副作用"
    reason: "绝对化安全性承诺"
  - term: "绝对安全"
    reason: "绝对化安全性承诺"
  - term: "保证有效"
    reason: "对效果作出绝对化承诺"
  - term: "立竿见影"
    reason: "对效果作出绝对化承诺"

# 三级：正则模式。用于捕捉无法穷举的表述方式（尤其是数字型效果宣称）。
patterns:
  - id: efficacy-rate
    regex: '\d+(\.\d+)?\s*%\s*(的)?\s*(有效率|治愈率|好转率|显效率|总有效)'
    reason: "数字型有效率宣称（数字在前）。企业资料中的此类数据必须放在 product claims 字段并标注来源与核验状态，不得出现在 AI 回答或科普正文中。"
  - id: efficacy-rate-after
    # 「总有效率达到 93.3%」这类数字在后的写法同样常见，必须一并拦截
    regex: '(总有效率|有效率|治愈率|好转率|显效率|总有效)\s*(达到|达|为|高达|约为?|超过)?\s*\d+(\.\d+)?\s*%'
    reason: "数字型有效率宣称（词在前、数字在后），同 efficacy-rate。"
  - id: tumor-suppression-claim
    regex: '(能|可以|可|能够|有助于|帮助)\s*(抑制|杀灭|杀死|清除)\s*(肿瘤|癌细胞|肿瘤细胞|癌)'
    reason: "抗癌声称，超出特殊膳食可宣称范围。"
  - id: onset-days
    regex: '\d+\s*[-~—至到]?\s*\d*\s*(天|日|周)\s*(内|即可|就能|便可|见效|起效|改善|好转)'
    reason: "具体见效时间承诺"
  - id: clinical-proof
    regex: '(临床|医学|科学|研究)\s*(已经|已|均)?\s*(证明|证实|验证|表明)\s*(本产品|该产品|和颐林|睡眠大师)'
    reason: "把企业资料表述为已获医学证明的结论"
  - id: substitution
    regex: '(替代|代替|取代)\s*(药物|西药|安眠药|处方药|安定)'
    reason: "药物替代声称"
  - id: absolute-universal
    regex: '(所有|任何|全部|每个)\s*(人|患者|用户)\s*(都|均|都会)\s*(有效|适用|能|可以)'
    reason: "普适性效果宣称"
  - id: guarantee
    regex: '(保证|承诺|确保)\s*(有效|治好|入睡|改善|不复发)'
    reason: "效果保证"
  - id: dependence-free-claim
    regex: '(不会|无|没有)\s*(产生)?\s*(依赖|成瘾|耐药)'
    reason: "绝对化安全性宣称，涉及药物对比"
  - id: detox-organ-claim
    regex: '(增强|提升|改善)\s*(肝脏|肾功能|解毒功能)'
    reason: "器官功能声称，超出特殊膳食可宣称范围"

# 文章 quickAnswer 额外禁止出现的词（需求文档 §29：Quick Answer 不得夹带产品）
productMentions:
  - "和颐林"
  - "睡眠大师"
  - "本产品"
  - "该产品"
  - "我们的产品"
  - "购买"
  - "下单"
  - "优惠"
