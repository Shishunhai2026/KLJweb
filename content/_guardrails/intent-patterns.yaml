# ---------------------------------------------------------------------------
# 意图识别模式（需求文档 §18「AI 助手回答流程」的问题分类环节）
#
# 分类结果决定三件事：
#   1. 检索时把哪一类知识排在前面
#   2. 是否需要引导用户去做睡眠自测
#   3. 【最重要】是否开放产品语料——见 lib/ai/intent/classify.ts 的状态机
# ---------------------------------------------------------------------------
version: 1
updatedAt: "2026-10-01"

# ---------------------------------------------------------------------------
# 睡眠问题类型识别
# 这里的 category 与 lib/content/taxonomy.ts 的 SLEEP_PROBLEM_CATEGORIES 一一对应
# ---------------------------------------------------------------------------
problemPatterns:
  - category: difficulty-initiating
    label: "入睡困难"
    patterns:
      - '(睡不着|入睡困难|入睡难|很难入睡|难以入睡|不容易睡着)'
      - '(躺|睡).{0,8}(很久|半天|一两个?小时|好久).{0,8}(还)?(睡不着|没睡着|醒着)'
      - '(越想睡越睡不着|越躺越精神|翻来覆去)'
      - '(脑子|大脑|思绪).{0,10}(停不下来|一直想|转个不停|很乱)'
      - '(一(到|躺)床上就精神|躺下就清醒)'

  - category: night-awakening
    label: "夜间易醒"
    patterns:
      - '(半夜|夜里|晚上).{0,8}(总是|经常|老是|容易)?(醒|醒来|醒过来)'
      - '(一晚上|一夜).{0,6}(醒|起来).{0,6}(好几|几|两三|四五)次'
      - '(睡).{0,4}(一两个?小时|两三个?小时).{0,6}(就|又).{0,4}醒'
      - '(半夜醒来).{0,10}(睡不着|很难再睡|难以入睡|再睡)'
      - '(睡不踏实|睡睡醒醒|时睡时醒)'

  - category: early-awakening
    label: "早醒"
    patterns:
      - '(凌晨|半夜|天亮前|早上).{0,6}(两|三|四|五|2|3|4|5)点.{0,8}(醒|就醒)'
      - '(早醒|醒得太早|醒的早|天没亮就醒)'
      - '(凌晨).{0,6}(醒).{0,10}(睡不着|再也睡不着|无法再睡|睡不回去)'
      - '(每天).{0,6}(三四点|3点|4点|5点).{0,6}醒'

  - category: light-sleep
    label: "睡眠浅"
    patterns:
      - '(睡眠浅|睡得很浅|睡不沉|睡得很轻|睡得轻)'
      - '(一点|稍微|有点).{0,6}(声音|动静|响动|光).{0,8}(就|都会)(醒|被吵醒)'
      - '(容易|总是|经常).{0,4}(被吵醒|惊醒|醒)'
      - '(外面|楼下|楼上).{0,8}(有点声音).{0,6}(就醒)'

  - category: poor-sleep-quality
    label: "睡眠质量下降"
    patterns:
      - '(睡).{0,4}(了)?.{0,4}(八|8|七|7|九|9).{0,4}(个)?小时.{0,8}(还是|仍然|依然).{0,6}(累|困|困倦|疲惫|没精神)'
      - '(睡眠质量).{0,6}(不好|差|下降|不高)'
      - '(越睡越累|睡不醒|睡了跟没睡一样)'
      - '(深度睡眠).{0,6}(少|不足|不够)'

  - category: daytime-fatigue
    label: "白天疲劳"
    patterns:
      - '(白天).{0,6}(总是|经常|老是|特别)?(困|犯困|没精神|疲惫|想睡)'
      - '(下午).{0,6}(特别|很|老是).{0,4}(困|没精神)'
      - '(注意力).{0,6}(不集中|很难集中|下降)'

  - category: circadian-disruption
    label: "睡眠节律紊乱"
    patterns:
      - '(倒班|夜班|三班倒|倒时差|时差)'
      - '(作息).{0,6}(乱|不规律|不固定)'
      - '(每天|经常).{0,6}(熬夜|很晚睡|两三点才睡)'
      - '(周末|周日).{0,8}(补觉|睡懒觉|晚睡)'

  - category: sleep-anxiety
    label: "睡眠焦虑"
    patterns:
      - '(害怕|担心|怕).{0,8}(睡不着|失眠|今晚)'
      - '(一躺下).{0,8}(就|就开始).{0,6}(担心|害怕|紧张)'
      - '(睡眠焦虑|失眠焦虑)'
      - '(越怕).{0,6}(睡不着|失眠)'

  - category: stress-related
    label: "压力相关睡眠问题"
    patterns:
      - '(压力|工作|上班|考试|学业|加班|项目|面试).{0,12}(大|重|多).{0,10}(睡不着|睡不好|失眠)'
      - '(焦虑|紧张|烦|心事).{0,10}(睡不着|睡不好|影响睡眠)'
      - '(因为|由于).{0,10}(压力|工作|考试).{0,10}(睡不着|失眠)'

# ---------------------------------------------------------------------------
# 其他意图
# ---------------------------------------------------------------------------
wantsSelfTest:
  label: "想做睡眠自测"
  patterns:
    - '(自测|测试|测评|测一测|测一下|量表|问卷|评估一下).{0,10}(睡眠)?'
    - '(我|自己).{0,6}(是不是).{0,6}(失眠|有问题)'
    - '(ISI|失眠量表)'

asksProductInfo:
  label: "想了解产品信息"
  patterns:
    - '(和颐林|睡眠大师)'
    - '(这个|你们的|本|该).{0,4}产品'
    - '(成分|配方|配料|怎么吃|怎么喝|怎么冲泡|多少钱|价格|哪里买|购买|适用人群|禁忌)'

wantsProductRecommendation:
  label: "直接索要产品推荐"
  patterns:
    - '(推荐|介绍|有没有|什么).{0,8}(产品|东西|保健品|药|东西).{0,8}(能|可以|帮助|改善)'
    - '(吃|喝|用).{0,6}(什么|啥).{0,6}(能|可以).{0,6}(睡着|改善睡眠|睡得着)'
    - '(买|想买|要买).{0,6}(什么|哪个)'

# ---------------------------------------------------------------------------
# 持续时间识别——用于判断「是否持续超过一定时间」（需求文档 §21 的追问环节）
# ---------------------------------------------------------------------------
durationPatterns:
  label: "持续时间"
  patterns:
    - '(持续|已经|有).{0,6}(\d+|一|两|三|几|半).{0,4}(天|周|个?月|年)'
    - '(好几天|好几个月|大半年|一年多|很长时间|很久了)'
    - '(最近|这几天|这段时间|这阵子)'

# ---------------------------------------------------------------------------
# 超出服务范围——礼貌引导回睡眠话题
# ---------------------------------------------------------------------------
outOfScope:
  label: "超出睡眠健康范围"
  patterns:
    - '(股票|基金|彩票|房价|彩票|游戏|代练|贷款|信用卡)'
    - '(写|编|做).{0,4}(代码|程序|作业|论文|合同)'
    - '(你是谁|你叫什么|你是什么模型|你是不是AI|你有感情吗)'
