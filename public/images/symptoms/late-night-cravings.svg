<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="卡通人物半夜站在打开的冰箱前，抱着一堆零食">
  <title>半夜特别想吃东西</title>
  <!-- 窗外月亮 -->
  <circle cx="162" cy="42" r="17" fill="#d9a94b"/>
  <circle cx="152" cy="36" r="15" fill="#0e2439" opacity=".92"/>
  <!-- 冰箱 -->
  <rect x="24" y="52" width="76" height="108" rx="8" fill="#c6ddf0" stroke="#0e2439" stroke-width="5"/>
  <rect x="24" y="52" width="76" height="36" rx="8" fill="#6ba3d2" stroke="#0e2439" stroke-width="5"/>
  <path d="M92 74v10" stroke="#0e2439" stroke-width="5" stroke-linecap="round"/>
  <path d="M100 96l22-22" stroke="#0e2439" stroke-width="5" stroke-linecap="round"/>
  <!-- 冰箱里的光 -->
  <path d="M100 60l34 12v56l-34 12z" fill="#f4f2ee" opacity=".55"/>
  <!-- 人物 -->
  <circle cx="146" cy="112" r="24" fill="#c6ddf0" stroke="#0e2439" stroke-width="5"/>
  <path d="M124 102c2-12 10-18 22-18s20 6 22 18c-8-5-14-7-22-7s-14 2-22 7z" fill="#0e2439"/>
  <circle cx="138" cy="112" r="3.4" fill="#0e2439"/>
  <circle cx="154" cy="112" r="3.4" fill="#0e2439"/>
  <circle cx="141" cy="124" r="8" fill="#0e2439" opacity=".18"/>
  <circle cx="151" cy="124" r="8" fill="#0e2439" opacity=".18"/>
  <!-- 抱着的零食 -->
  <rect x="130" y="140" width="34" height="24" rx="5" fill="#d9a94b" stroke="#0e2439" stroke-width="4"/>
  <path d="M136 140v-8M158 140v-8" stroke="#0e2439" stroke-width="4" stroke-linecap="round"/>
  <!-- 手里的勺子 -->
  <path d="M120 132l-14-12" stroke="#0e2439" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="102" cy="116" rx="7" ry="5" fill="#6ba3d2" stroke="#0e2439" stroke-width="4"/>
  <path d="M28 160h144" stroke="#0e2439" stroke-width="5" stroke-linecap="round"/>
</svg>
