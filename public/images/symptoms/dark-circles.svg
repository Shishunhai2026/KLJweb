<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="夸张的卡通人物，眼睛周围顶着两个巨大的黑眼圈，一副没睡醒的样子">
  <title>黑眼圈重</title>

  <!-- 头发：做成有层次的碎发，而不是规整的「头盔」轮廓 -->
  <path d="M46 92c0-32 24-52 54-52s54 20 54 52c-6-14-14-20-22-22-6 6-16 9-32 9s-26-3-32-9c-8 2-16 8-22 22z" fill="#0e2439"/>
  <path d="M62 62c10-10 24-14 38-14M126 52c10 3 18 9 22 18" stroke="#295381" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 头 -->
  <circle cx="100" cy="112" r="52" fill="#c6ddf0" stroke="#0e2439" stroke-width="5"/>
  <path d="M50 96c4-24 24-38 50-38s46 14 50 38c-14-10-30-14-50-14s-36 4-50 14z" fill="#0e2439"/>

  <!-- 巨大的黑眼圈：这是本图的夸张点 -->
  <ellipse cx="78" cy="118" rx="21" ry="17" fill="#295381"/>
  <ellipse cx="122" cy="118" rx="21" ry="17" fill="#295381"/>

  <!-- 快睁不开的眼睛 -->
  <path d="M64 114c6-5 18-5 24 0" stroke="#f4f2ee" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M112 114c6-5 18-5 24 0" stroke="#f4f2ee" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="76" cy="124" r="3.2" fill="#f4f2ee"/>
  <circle cx="124" cy="124" r="3.2" fill="#f4f2ee"/>

  <!-- 眼皮下垂的弧线 -->
  <path d="M62 106c8-4 20-4 28 0" stroke="#0e2439" stroke-width="3" stroke-linecap="round" fill="none" opacity=".5"/>
  <path d="M110 106c8-4 20-4 28 0" stroke="#0e2439" stroke-width="3" stroke-linecap="round" fill="none" opacity=".5"/>

  <!-- 垮掉的嘴 -->
  <path d="M86 146c8-6 20-6 28 0" stroke="#0e2439" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- 头顶的困倦符号 -->
  <path d="M150 56l9 13h-8l9 13" stroke="#d9a94b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M166 40l6 9h-5l6 9" stroke="#d9a94b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".6"/>
</svg>
